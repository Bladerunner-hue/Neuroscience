name: Deploy Marimo WASM Book to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "marimo_notebooks/**"
      - "marimo_exports/**"
      - "data/processed/**"
      - ".github/workflows/deploy-pages.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin marimo so Vite chunk hashes match a known-good frontend (avoids
          # "Failed to fetch dynamically imported module" after partial deploys).
          pip install "marimo[recommended]==0.23.10" numpy pandas polars scipy matplotlib plotly scikit-learn seaborn pyarrow

      - name: Ensure multi-set summary for WASM embeds
        run: |
          test -f data/processed/book_bundle.json || { echo "Missing book_bundle.json"; exit 1; }
          # god_run_summary optional but preferred for Ch IX
          if [ ! -f data/processed/god_run_summary.json ]; then
            echo "WARNING: no god_run_summary.json — multi-set chapter will show empty summary"
            echo '{"n_runs":0,"records":[],"by_dataset_group":[],"datasets":[]}' > data/processed/god_run_summary.json
          fi
          python scripts/refresh_dataset_registry.py || true

      - name: Export notebooks to WASM book chapters
        run: |
          echo "Running WASM export + integration verify (fail on error)..."
          test -f marimo_notebooks/spectral_methods.py || { echo "Missing spectral_methods.py"; exit 1; }
          test -f marimo_notebooks/api_client.py || { echo "Missing api_client.py"; exit 1; }
          python marimo_exports/export_wasm.py --sync-docs --verify
          echo "=== WASM exports ==="
          find marimo_exports/wasm -name index.html -print
          echo "=== docs/wasm ==="
          find docs/wasm -name index.html -print

          # Shared Vite pool — chapters use ../shared-assets → docs/shared-assets
          if [ -d docs/wasm/shared-assets ] && [ ! -d docs/shared-assets ]; then
            cp -a docs/wasm/shared-assets docs/shared-assets
          fi
          test -d docs/shared-assets || test -d docs/wasm/shared-assets || {
            echo "FATAL: missing shared-assets under docs/"; exit 1;
          }
          SA=docs/shared-assets
          [ -d "$SA" ] || SA=docs/wasm/shared-assets
          ls "$SA"/run-page-*.js >/dev/null || { echo "FATAL: no run-page in shared-assets"; exit 1; }

          # Public book chapters (marimo WASM)
          for ch in 00_data_browser 00_qc_dashboard 01_pre_flight 02_eda_univariate \
                    03_eda_multivariate 04_feature_engineering 05_tf_results 09_multi_dataset_analysis; do
            test -f "docs/wasm/$ch/index.html" || { echo "Missing docs/wasm/$ch/index.html"; exit 1; }
            if [ -d "docs/wasm/$ch/assets" ]; then
              echo "FATAL: $ch still has private assets/ (should use shared-assets)"
              exit 1
            fi
            for tok in injected\ by\ export_wasm _helpers_b64 '"auto_instantiate": true' shared-assets; do
              grep -q "$tok" "docs/wasm/$ch/index.html" || { echo "FATAL: $ch missing $tok"; exit 1; }
            done
            entry=$(grep -oE 'shared-assets/index-[^"]+\.js' "docs/wasm/$ch/index.html" | head -1)
            test -n "$entry" || { echo "FATAL: $ch has no shared-assets index entry"; exit 1; }
            # Resolve ../shared-assets from docs/wasm/<ch>/ → docs/shared-assets
            if [ -f "docs/wasm/$entry" ]; then
              :
            elif [ -f "docs/$entry" ]; then
              :
            else
              echo "FATAL: missing asset docs/wasm/$entry or docs/$entry"
              exit 1
            fi
          done

          # QC + multi-set content smoke
          grep -qi multitaper docs/wasm/00_qc_dashboard/index.html || {
            echo "FATAL: 00_qc_dashboard export lacks multitaper content"
            exit 1
          }
          grep -q api_client docs/wasm/00_data_browser/index.html || {
            echo "FATAL: 00_data_browser missing api_client inject"
            exit 1
          }
          grep -q GOD_RUN_SUMMARY docs/wasm/09_multi_dataset_analysis/index.html || {
            echo "FATAL: 09_multi_dataset_analysis missing GOD_RUN_SUMMARY embed"
            exit 1
          }

          # Guard: never ship JSON-as-Python book_data
          if grep -q 'BOOK_BUNDLE = {' docs/wasm/01_pre_flight/index.html 2>/dev/null; then
            echo "FATAL: old BOOK_BUNDLE dict embed detected in WASM HTML"
            exit 1
          fi
          if ! grep -q '_book_json_b64\|json.loads' docs/wasm/01_pre_flight/index.html; then
            echo "FATAL: book_data JSON injection missing"
            exit 1
          fi

      - name: Verify non-marimo Pages surfaces (explore + static API)
        run: |
          set -euo pipefail
          # Gallery + explorer HTML
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          test -f docs/explore/index.html || { echo "FATAL: docs/explore/index.html missing"; exit 1; }
          test -f docs/.nojekyll || touch docs/.nojekyll

          # Static API — feature store + unified tables + multi-set
          for f in \
            docs/api/index.html \
            docs/api/health.json \
            docs/api/meta.json \
            docs/api/openapi.json \
            docs/api/architecture.json \
            docs/api/datasets.json \
            docs/api/surfaces.json \
            docs/api/local/files.json \
            docs/api/god_run_summary.json \
            docs/api/features/spectral.json \
            docs/api/features/spectral_clean.json \
            docs/api/features/subject.json \
            docs/api/features/condition.json \
            docs/api/features/participants.json \
            docs/api/qc.json \
            docs/api/bakeoff.json \
            docs/api/tf_results.json \
            docs/api/table/spectral.json \
            docs/api/table/subject.json \
            docs/api/table/condition.json \
            docs/api/table/qc.json \
            docs/api/table/datasets.json \
            docs/api/table/tf_results.json
          do
            test -f "$f" || { echo "FATAL: missing static API $f"; exit 1; }
          done

          python - <<'PY'
          import json
          from pathlib import Path

          h = json.loads(Path("docs/api/health.json").read_text())
          assert h.get("status") == "ok", h
          print("static API health ok", h.get("bundle"))

          for name in ("spectral", "subject", "condition", "qc", "datasets"):
              p = Path(f"docs/api/table/{name}.json")
              data = json.loads(p.read_text())
              assert "records" in data or "datasets" in data or data.get("n") is not None, name
              n = data.get("n")
              if n is None and "records" in data:
                  n = len(data["records"])
              print(f"  table {name}: n={n} bytes={p.stat().st_size}")

          # explore must use relative API (GitHub project pages safe)
          exp = Path("docs/explore/index.html").read_text()
          assert "../api" in exp or 'return ".."' in exp, "explore must resolve relative ../api"
          assert "github.io" in exp  # documents Pages path handling
          # gallery links explore
          gal = Path("docs/index.html").read_text()
          assert "explore/" in gal, "gallery must link explore/"
          assert "wasm/00_data_browser" in gal or "00_data_browser" in gal
          assert "wasm/09_multi_dataset" in gal or "09_multi_dataset" in gal
          print("non-marimo HTML + static API checks OK")
          PY

          # Simulate static site fetch paths used by explore (relative from explore/)
          python - <<'PY'
          import json
          from pathlib import Path
          # From docs/explore/, ../api/table/spectral.json → docs/api/table/spectral.json
          for rel in [
              "api/table/spectral.json",
              "api/table/subject.json",
              "api/datasets.json",
              "api/god_run_summary.json",
              "api/surfaces.json",
              "api/local/files.json",
              "api/health.json",
          ]:
              p = Path("docs") / rel
              assert p.is_file(), p
              json.loads(p.read_text())
          print("relative path graph docs/explore → docs/api OK")
          PY

      - name: Local static server smoke (non-marimo)
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory docs &
          PID=$!
          sleep 1
          cleanup() { kill $PID 2>/dev/null || true; }
          trap cleanup EXIT
          # GitHub Pages-like paths under site root = docs/
          curl -sf http://127.0.0.1:8766/index.html | head -c 200 >/dev/null
          curl -sf http://127.0.0.1:8766/explore/ | head -c 200 >/dev/null
          curl -sf http://127.0.0.1:8766/explore/index.html | head -c 200 >/dev/null
          curl -sf http://127.0.0.1:8766/api/health.json | python -c "import sys,json; assert json.load(sys.stdin)['status']=='ok'"
          curl -sf http://127.0.0.1:8766/api/table/spectral.json | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('n',0)>0 or len(d.get('records')or[])>0"
          curl -sf http://127.0.0.1:8766/api/datasets.json | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('n',0)>=1"
          curl -sf http://127.0.0.1:8766/api/god_run_summary.json | python -c "import sys,json; json.load(sys.stdin)"
          # relative resolution: from explore, browser would request ../api/...
          curl -sf http://127.0.0.1:8766/api/table/subject.json | python -c "import sys,json; d=json.load(sys.stdin); print('subject n', d.get('n'))"
          echo "static http.server smoke OK"

      - name: Local FastAPI smoke (marimo + explore + API)
        run: |
          set -euo pipefail
          pip install fastapi uvicorn "marimo[recommended]==0.23.10" -q
          export PYTHONPATH=marimo_notebooks
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app as appmod
          c = TestClient(appmod.app)
          checks = [
              "/explore/",
              "/api/health",
              "/api/table/spectral",
              "/api/datasets",
              "/api/surfaces",
              "/api/local/files",
              "/api/god_run_summary.json",  # may 404 live — also try without
          ]
          for path in ["/explore/", "/api/health", "/api/table/spectral", "/api/datasets", "/api/surfaces", "/api/local/files"]:
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code, r.text[:200])
              print(path, r.status_code, len(r.content))
          # live table shape
          d = c.get("/api/table/spectral").json()
          assert d.get("n", 0) > 0
          print("FastAPI TestClient smoke OK")
          PY

      - name: Ensure Pages metadata listing
        run: |
          test -f docs/index.html
          touch docs/.nojekyll
          ls -la docs/
          ls -la docs/wasm/ | head
          ls -la docs/api/ | head
          ls -la docs/explore/
          ls -la docs/api/table/ | head

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
