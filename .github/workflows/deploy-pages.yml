name: Deploy Marimo WASM Book to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "marimo_notebooks/**"
      - "marimo_exports/export_wasm.py"
      - ".github/workflows/deploy-pages.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "marimo[recommended]" numpy pandas scipy matplotlib plotly scikit-learn seaborn

      - name: Export notebooks to WASM book chapters
        run: |
          echo "Running WASM export (fail on error)..."
          python marimo_exports/export_wasm.py --sync-docs
          echo "=== WASM exports ==="
          find marimo_exports/wasm -name index.html -print
          echo "=== docs/wasm ==="
          find docs/wasm -name index.html -print
          # Require public book chapters
          for ch in 01_pre_flight 02_eda_univariate 03_eda_multivariate 04_feature_engineering 05_tf_results; do
            test -f "docs/wasm/$ch/index.html" || { echo "Missing docs/wasm/$ch/index.html"; exit 1; }
          done
          # Guard: never ship JSON-as-Python book_data (true/false NameError)
          if grep -q 'BOOK_BUNDLE = {' docs/wasm/01_pre_flight/index.html 2>/dev/null; then
            echo "FATAL: old BOOK_BUNDLE dict embed detected in WASM HTML"
            exit 1
          fi
          if ! grep -q '_book_json_b64\|json.loads' docs/wasm/01_pre_flight/index.html; then
            echo "FATAL: book_data JSON injection missing"
            exit 1
          fi

      - name: Ensure Pages metadata
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          touch docs/.nojekyll
          ls -la docs/
          ls -la docs/wasm/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
