name: Deploy Marimo WASM Book to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "marimo_notebooks/**"
      - "marimo_exports/**"
      - "data/processed/**"
      - ".github/workflows/deploy-pages.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin marimo so Vite chunk hashes match a known-good frontend (avoids
          # "Failed to fetch dynamically imported module" after partial deploys).
          pip install "marimo[recommended]==0.23.10" numpy pandas polars scipy matplotlib plotly scikit-learn seaborn

      - name: Export notebooks to WASM book chapters
        run: |
          echo "Running WASM export + integration verify (fail on error)..."
          test -f data/processed/book_bundle.json || { echo "Missing book_bundle.json"; exit 1; }
          test -f marimo_notebooks/spectral_methods.py || { echo "Missing spectral_methods.py"; exit 1; }
          python marimo_exports/export_wasm.py --sync-docs --verify
          echo "=== WASM exports ==="
          find marimo_exports/wasm -name index.html -print
          echo "=== docs/wasm ==="
          find docs/wasm -name index.html -print
          # Shared Vite pool (one run-page for all chapters)
          test -d docs/wasm/shared-assets || { echo "FATAL: missing docs/wasm/shared-assets"; exit 1; }
          ls docs/wasm/shared-assets/run-page-*.js >/dev/null || { echo "FATAL: no run-page in shared-assets"; exit 1; }
          # Require public book chapters
          for ch in 00_qc_dashboard 01_pre_flight 02_eda_univariate 03_eda_multivariate 04_feature_engineering 05_tf_results; do
            test -f "docs/wasm/$ch/index.html" || { echo "Missing docs/wasm/$ch/index.html"; exit 1; }
            # Must NOT keep a private assets/ tree (would drift from shared pool)
            if [ -d "docs/wasm/$ch/assets" ]; then
              echo "FATAL: $ch still has private assets/ (should use shared-assets)"
              exit 1
            fi
            # Full injection set required for adaptive multitaper + QC stack
            for tok in injected\ by\ export_wasm _helpers_b64 _spectral_b64 _book_json_b64 '"auto_instantiate": true' shared-assets; do
              grep -q "$tok" "docs/wasm/$ch/index.html" || { echo "FATAL: $ch missing $tok"; exit 1; }
            done
            # Entry script must resolve under shared-assets
            entry=$(grep -oE 'shared-assets/index-[^"]+\.js' "docs/wasm/$ch/index.html" | head -1)
            test -n "$entry" || { echo "FATAL: $ch has no shared-assets index entry"; exit 1; }
            test -f "docs/wasm/$entry" || { echo "FATAL: missing docs/wasm/$entry"; exit 1; }
          done
          # Guard: never ship JSON-as-Python book_data (true/false NameError)
          if grep -q 'BOOK_BUNDLE = {' docs/wasm/01_pre_flight/index.html 2>/dev/null; then
            echo "FATAL: old BOOK_BUNDLE dict embed detected in WASM HTML"
            exit 1
          fi
          if ! grep -q '_book_json_b64\|json.loads' docs/wasm/01_pre_flight/index.html; then
            echo "FATAL: book_data JSON injection missing"
            exit 1
          fi
          # QC chapter must mention multitaper surface (smoke that export is current)
          grep -qi multitaper docs/wasm/00_qc_dashboard/index.html || {
            echo "FATAL: 00_qc_dashboard export lacks multitaper content"
            exit 1
          }
          # Static FastAPI mirror (GitHub Pages cannot run uvicorn)
          for f in docs/api/index.html docs/api/health.json docs/api/meta.json \
                   docs/api/openapi.json docs/api/features/spectral.json \
                   docs/api/features/spectral_clean.json docs/api/qc.json \
                   docs/api/bakeoff.json; do
            test -f "$f" || { echo "FATAL: missing static API $f"; exit 1; }
          done
          python -c "import json; h=json.load(open('docs/api/health.json')); assert h.get('status')=='ok'; print('static API health ok', h.get('bundle'))"

      - name: Ensure Pages metadata
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          touch docs/.nojekyll
          ls -la docs/
          ls -la docs/wasm/
          ls -la docs/api/
          ls -la docs/api/features/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
